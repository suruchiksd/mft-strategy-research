  block_length: max(10, 2 * future_horizon)
quantiles:
  buckets: 10
  minimum_cross_section: 20
tails: [0.05, 0.10, 0.20]
confirmation_evaluability:
  minimum_daily_ic_dates_per_horizon: 20
  supported_minimum_daily_ic_dates_per_horizon: 60
acceptance_rules:
  historical_positive_horizons_required: 6
  confirmation_positive_horizons_required: 4
  moderate_positive_horizons_required: 4
  nonoverlap_positive_horizons_required: 4
  require_positive_average_ic_in_both_universes: true
  require_no_leave_one_date_sign_flip_for_supporting_horizons: true
classification_rules:
  SUPPORTED: all directional acceptance rules pass and every horizon has at least 60 daily IC dates
  SUPPORTIVE BUT SHORT SAMPLE: all directional acceptance rules pass and every horizon has at least 20 but fewer than 60 daily IC dates
  MIXED: evaluable sample with two or three positive primary horizons
  CONTRADICTORY: evaluable sample with zero or one positive primary horizon
  INSUFFICIENT SAMPLE: corporate-action extension is not accepted or any horizon has fewer than 20 daily IC dates
overall_rules:
  PASS FOR COMPLEMENTARITY RESEARCH: both candidates are SUPPORTED
  CONDITIONAL PASS: at least one candidate is SUPPORTED or both are SUPPORTIVE BUT SHORT SAMPLE
  RESEARCH FURTHER: at least one candidate is SUPPORTIVE BUT SHORT SAMPLE, MIXED, or INSUFFICIENT SAMPLE and PASS/CONDITIONAL/FAIL do not apply
  FAIL: both candidates are CONTRADICTORY on evaluable certified samples
