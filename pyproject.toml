[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mft-strategy-research"
version = "0.2.0"
description = "Conditional current-universe research data; no factors or execution"
requires-python = ">=3.11"
dependencies = ["pandas==3.0.3", "pyarrow==25.0.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = ["integration: validate the actual built dataset and source fingerprint"]
